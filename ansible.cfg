[defaults]
# Example inventory; override with bootstrap.sh --inventory or ANSIBLE_INVENTORY.
inventory = ansible/inventory/example.yml
roles_path = ansible/roles
stdout_callback = default
# Secure default. For lab use: export ANSIBLE_HOST_KEY_CHECKING=False
host_key_checking = True
retry_files_enabled = False
# Optional fact cache to speed re-runs on large hosts.
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[privilege_escalation]
become = True
