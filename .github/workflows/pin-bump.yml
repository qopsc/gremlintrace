---
name: Bump E2B pin

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-pin:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve upstream pin and update versions.yml
        run: |
          python3 -m pip install --disable-pip-version-check -q pyyaml
          ./ci/bump-e2b-pin.sh
      # A dist bump that changes envd/kernel/Firecracker pins requires template rebuilds;
      # upgrade.yml (later task) gates that on env_builds.envd_version.
      - name: Open pull request
        # peter-evans/create-pull-request v7.0.8
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e
        with:
          commit-message: Bump e2b_pin to latest upstream infra
          title: Bump e2b_pin to latest upstream infra
          body: |
            Automated monthly pin bump from `e2b-dev/infra` HEAD.

            - Updates `versions.yml` (`e2b_pin`, `e2b_dist_version`, `envd_version`, `goose_version`)
            - Syncs `e2b/e2b.pin`

            Merge only after `build-e2b` and the installer matrix are green on this PR.
          branch: automation/bump-e2b-pin
          delete-branch: true
