---
name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install lint toolchain
        run: ./ci/install-lint-tools.sh
      - name: Read Node.js CI version
        id: nodever
        run: |
          echo "version=$(python3 ci/yaml_versions.py get node_ci_version versions.yml)" \
            >> "${GITHUB_OUTPUT}"
      - name: Set up Node.js
        # actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.nodever.outputs.version }}
          cache: npm
          cache-dependency-path: e2b/templates/package-lock.json
      - name: Repository checks (make check)
        run: make check
      - name: Workflow lint (actionlint)
        run: actionlint
