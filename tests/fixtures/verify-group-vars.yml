---
# Assert operator variables from ansible/group_vars/all.yml resolve at runtime.
- name: Verify group_vars load
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../ansible/group_vars/all.yml
    - ../../versions.yml
  tasks:
    - name: Assert tls_mode default from group_vars/all.yml
      ansible.builtin.assert:
        that:
          - tls_mode == 'acme_dns'
        fail_msg: "tls_mode did not resolve to the documented default (got {{ tls_mode | default('UNDEF') }})"
      tags:
        - always
