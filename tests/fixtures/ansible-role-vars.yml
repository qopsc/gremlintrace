---
# Fixture variables for offline template rendering tests.
qops_domain: fixture.example.com
e2b_hugepages_percentage: 75
e2b_clickhouse_retention_days: 14
e2b_data_device: ""
sandbox_host_cidr: 10.11.0.0/16
sandbox_vrt_cidr: 10.12.0.0/16
e2b_allow_sandbox_internal_cidrs:
  - 10.0.0.0/8
firecracker_version: v1.14-0.2.0
kernel_version: vmlinux-6.1.158-c1a568c
busybox_version: "1.36.1"
e2b_postgres_image: postgres
e2b_postgres_tag: "18"
e2b_redis_image: redis
e2b_redis_tag: "8"
e2b_clickhouse_image: clickhouse/clickhouse-server
e2b_clickhouse_tag: 25.8.30.16
e2b_otel_collector_image: otel/opentelemetry-collector-contrib
e2b_otel_collector_tag: 0.146.0
e2b_dist_version: "6e4ce14"
common_sysctl_settings:
  vm.swappiness: 10
  vm.vfs_cache_pressure: 50
  net.core.somaxconn: 65535
  net.core.netdev_max_backlog: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  vm.max_map_count: 1048576
  net.ipv4.ip_forward: 1
  net.netfilter.nf_conntrack_max: 2097152
common_nofile_limit: 1048576
common_journald_system_max_use: 500M
common_journald_system_max_file_size: 50M
common_journald_runtime_max_use: 200M
docker_address_pools:
  - base: 10.20.0.0/16
    size: 24
  - base: 10.21.0.0/16
    size: 24
docker_log_max_size: 100m
docker_log_max_file: "3"
e2b_datastores_compose_project: e2b-data
e2b_datastores_postgres_bind_host: 127.0.0.1
e2b_datastores_postgres_port: 5433
e2b_datastores_postgres_db: e2b
e2b_datastores_postgres_user: postgres
e2b_datastores_redis_bind_host: 127.0.0.1
e2b_datastores_redis_port: 6379
e2b_datastores_clickhouse_bind_host: 127.0.0.1
e2b_datastores_clickhouse_http_port: 8123
e2b_datastores_clickhouse_native_port: 9000
e2b_datastores_clickhouse_db: default
e2b_datastores_clickhouse_username: e2b
e2b_datastores_clickhouse_password: test-clickhouse-password
e2b_datastores_otel_bind_host: 127.0.0.1
e2b_datastores_otel_grpc_port: 4317
e2b_datastores_otel_health_port: 13133
e2b_host_orchestrator_root: /orchestrator
e2b_host_hugepages_mount: /mnt/hugepages
e2b_host_hugepages_service_name: e2b-hugepages.service
e2b_host_nbd_max: 4096
host_firewall_nftables_config_path: /etc/nftables/qops.nft
