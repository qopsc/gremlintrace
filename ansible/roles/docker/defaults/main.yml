---
docker_daemon_config_path: /etc/docker/daemon.json

docker_address_pools:
  - base: 10.20.0.0/16
    size: 24
  - base: 10.21.0.0/16
    size: 24

docker_log_max_size: 100m
docker_log_max_file: "3"

docker_packages_debian:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

docker_packages_redhat:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
