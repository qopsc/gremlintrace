---
- name: Disable firewalld when present
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false
  when: ansible_os_family == "RedHat"
  tags:
    - host_firewall

- name: Ensure nftables config directory exists
  ansible.builtin.file:
    path: "{{ host_firewall_nftables_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - host_firewall

- name: Render qops nftables ruleset
  ansible.builtin.template:
    src: qops.nft.j2
    dest: "{{ host_firewall_nftables_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Load qops nftables ruleset
  tags:
    - host_firewall

# The distro nftables.service is not used: Ubuntu's /etc/nftables.conf begins
# with `flush ruleset` and the unit's ExecStop flushes the whole ruleset, which
# would drop Docker's NAT and the orchestrator's per-sandbox rules on any
# restart (package upgrade, operator reload). Earlier revisions appended an
# include there and enabled that service: the include is removed and the unit
# is disabled below. It is never stopped, because stopping it is exactly the
# flush this role avoids; a disabled-but-running unit is harmless until reboot.
- name: Remove qops include from the distro nftables config
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^include "{{ host_firewall_nftables_config_path | regex_escape }}"'
    state: absent
  loop:
    - /etc/nftables.conf
    - /etc/sysconfig/nftables.conf
  failed_when: false
  tags:
    - host_firewall

- name: Disable the distro nftables.service without stopping it
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: false
  register: host_firewall_distro_nftables
  # Minimal images may not ship the unit at all; that is fine.
  failed_when:
    - host_firewall_distro_nftables is failed
    - "'Could not find the requested service' not in (host_firewall_distro_nftables.msg | default(''))"
  tags:
    - host_firewall

- name: Install qops nftables boot unit
  ansible.builtin.template:
    src: qops-nftables.service.j2
    dest: /etc/systemd/system/qops-nftables.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for host_firewall
  tags:
    - host_firewall

- name: Flush host_firewall handlers before enabling the unit
  ansible.builtin.meta: flush_handlers
  tags:
    - host_firewall

- name: Enable qops nftables boot unit
  ansible.builtin.systemd_service:
    name: qops-nftables.service
    enabled: true
    state: started
  tags:
    - host_firewall
