---
- name: Reload systemd for host_firewall
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Reload systemd for host_firewall

- name: Load qops nftables ruleset
  ansible.builtin.command:
    cmd: nft -f {{ host_firewall_nftables_config_path }}
  changed_when: false
  listen: Load qops nftables ruleset
