---
kodus_install_dir: /opt/kodus-installer
kodus_compose_project: kodus
kodus_git_repo: https://github.com/kodustech/kodus-installer.git
kodus_env_file: "{{ kodus_install_dir }}/.env"
kodus_compose_override: "{{ kodus_install_dir }}/docker-compose.override.yml"
kodus_persist_dir: /etc/qops/kodus
kodus_generated_secrets_file: "{{ kodus_persist_dir }}/generated-secrets.env"
kodus_env_render_config: "{{ kodus_persist_dir }}/render-config.json"
kodus_callback_urls_file: "{{ kodus_persist_dir }}/callback-urls.txt"
kodus_digest_file: "{{ kodus_persist_dir }}/install.digest"

kodus_bind_host: "127.0.0.1"
kodus_web_port: 3000
kodus_api_port: 3001
kodus_webhooks_port: 3332
kodus_mcp_port: 3101
kodus_postgres_port: 5432
kodus_mongo_port: 27017
kodus_rabbitmq_amqp_port: 5672
kodus_rabbitmq_mgmt_port: 15672
kodus_rabbitmq_metrics_port: 15692
kodus_web_port_api: 443

kodus_web_host: "kodus.{{ qops_domain }}"
kodus_api_host: "kodus-api.{{ qops_domain }}"
kodus_webhooks_host: "kodus-webhooks.{{ qops_domain }}"
kodus_web_url: "https://{{ kodus_web_host }}"
kodus_api_url: "https://{{ kodus_api_host }}"
kodus_webhooks_url: "https://{{ kodus_webhooks_host }}"
kodus_e2b_domain: "e2b.{{ qops_domain }}"
kodus_e2b_template_id: kodus-sandbox
kodus_e2b_template_graph_id: kodus-sandbox-graph
kodus_sandbox_provider: e2b
kodus_worker_role: code-review
kodus_cloud_mode: false

kodus_docker_networks:
  - shared-network
  - monitoring-network
  - kodus-backend-services
kodus_hairpin_network: "{{ traefik_kodus_network | default('kodus') }}"

kodus_health_urls:
  - "http://{{ kodus_bind_host }}:{{ kodus_web_port }}/health"
  - "http://{{ kodus_bind_host }}:{{ kodus_api_port }}/health"
  - "http://{{ kodus_bind_host }}:{{ kodus_webhooks_port }}/health"
kodus_health_retries: 60
kodus_health_delay_seconds: 2

kodus_llm_provider_model: auto
kodus_openai_api_key: ""
kodus_openai_force_base_url: ""
kodus_extra_hosts_hairpin: true
kodus_ca_container_path: /etc/ssl/certs/qops-ca.pem
kodus_package_git: git
