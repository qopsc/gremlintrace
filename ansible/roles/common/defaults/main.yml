---
common_packages_debian:
  - iptables
  - nftables
  - curl
  - jq
  - uuid-runtime
  - nfs-common
  - chrony
  - unattended-upgrades
  - apt-listchanges

common_packages_redhat:
  - iptables-nft
  - nftables
  - curl
  - jq
  - util-linux
  - nfs-utils
  - chrony
  - dnf-plugins-core
  - kernel-modules-extra

common_sysctl_settings:
  vm.swappiness: 10
  vm.vfs_cache_pressure: 50
  net.core.somaxconn: 65535
  net.core.netdev_max_backlog: 65535
  net.ipv4.tcp_max_syn_backlog: 65535
  vm.max_map_count: 1048576
  net.ipv4.ip_forward: 1
  net.netfilter.nf_conntrack_max: 2097152

common_nofile_limit: 1048576
common_journald_system_max_use: 500M
common_journald_system_max_file_size: 50M
common_journald_runtime_max_use: 200M

common_chrony_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
