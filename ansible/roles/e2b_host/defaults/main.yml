---
e2b_host_orchestrator_root: /orchestrator
e2b_host_orchestrator_disk_path: /var/lib/e2b/orchestrator
e2b_host_hugepages_mount: /mnt/hugepages
e2b_host_fc_versions_dir: /fc-versions
e2b_host_fc_kernels_dir: /fc-kernels
e2b_host_fc_busybox_dir: /fc-busybox
e2b_host_fc_envd_dir: /fc-envd
e2b_host_dist_install_dir: /usr/local/lib/e2b

e2b_host_swapfile_path: /swapfile
e2b_host_swapfile_size_mb: 1024
e2b_host_nbd_max: 4096

e2b_host_fc_artifacts_local_path: ""
e2b_host_fc_artifacts_download_url: ""
e2b_host_fc_artifacts_cache_dir: /var/cache/qops

e2b_host_orchestrator_subdirs:
  - sandbox
  - template
  - build

e2b_host_hugepages_service_name: e2b-hugepages.service
