---
# Real hairpin gate. site.yml imports this AFTER the kodus role with
# traefik_hairpin_required=true. The traefik role itself imports it with
# the default (false) so a first install degrades when the kodus network
# does not exist yet.
- name: Install hairpin-check helper
  ansible.builtin.copy:
    src: hairpin-check.sh
    dest: /usr/local/lib/qops/hairpin-check.sh
    mode: "0755"
    owner: root
    group: root
  tags:
    - traefik

- name: Hairpin-check api.e2b from the Kodus network
  ansible.builtin.command:
    cmd: >-
      /usr/local/lib/qops/hairpin-check.sh
      {{ traefik_kodus_network }}
      {{ traefik_hairpin_url }}
      {{ traefik_hairpin_image }}
  environment:
    TRAEFIK_HAIRPIN_REQUIRED: "{{ '1' if (traefik_hairpin_required | bool) else '0' }}"
    TRAEFIK_HAIRPIN_RETRIES: "{{ traefik_hairpin_retries }}"
    TRAEFIK_HAIRPIN_DELAY: "{{ traefik_hairpin_delay_seconds }}"
    # Same extra_hosts the kodus role gives its containers, so the probe sees
    # what Kodus sees; empty unless the operator enabled the hairpin fallback.
    TRAEFIK_HAIRPIN_EXTRA_HOSTS: >-
      {{ (kodus_hairpin_hosts | default([]) | map('regex_replace', '$', ':host-gateway') | join(' '))
         if (kodus_extra_hosts_hairpin | default(false) | bool) else '' }}
    TRAEFIK_HAIRPIN_CA_FILE: "{{ (tls_ca_path | default('')) if tls_mode == 'internal_ca' else '' }}"
  register: traefik_hairpin
  changed_when: false
  tags:
    - traefik
