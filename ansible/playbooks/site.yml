---
- name: Codereviewer full install through Kodus
  hosts: codereviewer
  become: true
  vars_files:
    - ../../versions.yml
  pre_tasks:
    - name: Load documented defaults without overriding inventory
      ansible.builtin.include_tasks: ../tasks/load-defaults.yml
  roles:
    - role: preflight
    - role: common
    - role: host_firewall
    - role: docker
    - role: e2b_host
    - role: e2b_datastores
    - role: e2b_services
    - role: e2b_templates
    - role: traefik
    - role: kodus
  tasks:
    - name: Hairpin-check api.e2b after Kodus created its network
      ansible.builtin.include_role:
        name: traefik
        tasks_from: hairpin.yml
      vars:
        traefik_hairpin_required: true

- name: Codereviewer backup and doctor
  hosts: codereviewer
  become: true
  vars_files:
    - ../../versions.yml
    - ../group_vars/all.yml
  roles:
    - role: backup
    - role: doctor
