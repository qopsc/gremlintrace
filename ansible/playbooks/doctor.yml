---
- name: Codereviewer health check
  hosts: codereviewer
  become: true
  vars_files:
    - ../../versions.yml
    - ../group_vars/all.yml
  pre_tasks:
    - name: Verify operator and pin variables resolve from vars_files
      ansible.builtin.assert:
        that:
          - tls_mode is defined
          - tls_mode in ['acme_dns', 'provided', 'internal_ca']
          - kodus_image_tag is defined
          - kodus_image_tag != 'latest'
        fail_msg: >-
          vars_files did not load group_vars/all.yml and/or versions.yml
          (tls_mode={{ tls_mode | default('UNDEF') }},
          kodus_image_tag={{ kodus_image_tag | default('UNDEF') }})
      tags:
        - always
  tasks:
    - name: Hairpin-check api.e2b from the Kodus network
      ansible.builtin.include_role:
        name: traefik
        tasks_from: hairpin.yml
      vars:
        traefik_hairpin_required: true
  roles:
    - role: doctor
